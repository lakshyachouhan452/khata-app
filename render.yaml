services:
  - type: web
    name: khata-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_V1_STR
        value: /api/v1
      - key: CORS_ORIGINS
        value: "*"
      # If using Neon, set this in the Render dashboard:
      # - key: DATABASE_URL
      #   value: <your-neon-postgres-url>
